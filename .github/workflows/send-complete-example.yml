name: Send one complete report example

on:
  push:
    branches: [main]
    paths: ['.github/workflows/send-complete-example.yml']

permissions:
  contents: read

concurrency:
  group: industry-report-monitor
  cancel-in-progress: false

jobs:
  complete-example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI }}
      STATE_PATH: example-state.sqlite3
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Read original delivery metadata
        run: |
          git fetch --no-tags origin refs/heads/notification-state
          git show FETCH_HEAD:state.sqlite3 > example-state.sqlite3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Send exactly one summary and its native PDF
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from reportbot.classify import classify
          from reportbot.config import Config
          from reportbot.http import make_session
          from reportbot.runner import resolve
          from reportbot.state import State
          from reportbot.telegram import Telegram

          class VerifiedTelegram(Telegram):
              summary_deliveries = 0
              def send(self, text):
                  result = super().send(text)
                  self.summary_deliveries += 1
                  print('그룹방에 10줄 요약 메시지를 보냈습니다.', flush=True)
                  return result

          def main():
              config = Config.from_env()
              database_path = Path(config.state_path).resolve()
              before = database_path.read_bytes()
              with sqlite3.connect(database_path.as_uri() + '?mode=ro', uri=True) as database:
                  row = database.execute("SELECT metadata_json,pdf_hash FROM reports WHERE source='naver' AND source_id='46612' AND outcome='sent' AND date(processed_at,'+9 hours')='2026-10-26'").fetchone()
              if not row:
                  raise RuntimeError('어제 실제 발송한 대상 자료를 확인하지 못했습니다.')
              report = State._decode(row[0])
              telegram = VerifiedTelegram(config.token, config.chat_id)
              info = telegram.call('getChat', {'chat_id': config.chat_id})
              if info.get('type') not in {'group', 'supergroup'}:
                  raise RuntimeError('설정된 수신처가 그룹방이 아닙니다.')
              with make_session() as session:
                  report = resolve(report, session)
                  decision = classify(report, session, config.min_pdf_pages)
              if not decision.accepted or decision.pages != 27 or decision.pdf_hash != row[1]:
                  raise RuntimeError('어제 발송한 PDF 원문과 일치하지 않습니다.')
              print(f'완성본 대상: {report.title} · {report.broker} · {decision.pages}쪽', flush=True)
              result = telegram.send_report(report, decision)
              if not result.get('document') or result.get('chat', {}).get('type') not in {'group', 'supergroup'}:
                  raise RuntimeError('그룹 PDF 첨부 완료를 확인하지 못했습니다.')
              print('그룹방에 PDF 원문 27쪽을 첨부했습니다.', flush=True)
              if telegram.summary_deliveries != 1:
                  raise RuntimeError('PDF는 전송했으나 10줄 요약 완료를 확인하지 못했습니다.')
              if database_path.read_bytes() != before:
                  raise RuntimeError('기존 발송 기록의 변경을 발견했습니다.')
              print('완성본 1세트 발송 완료: 10줄 요약 → PDF 원문. 기존 발송 기록은 유지했습니다.', flush=True)

          try:
              main()
          except Exception as error:
              print(f'완성본 시험을 완료하지 못했습니다 ({type(error).__name__}).')
              raise SystemExit(1) from None
          PY
