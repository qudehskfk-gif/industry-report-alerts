name: Send five recent industry reports

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: industry-report-monitor
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI }}
      MIN_PDF_PAGES: '20'
      MAX_LIST_PAGES: '100'
      SCAN_LOOKBACK_DAYS: '45'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Select and send exactly five reports
        run: python -m reportbot.samples
