name: Verify Gemini summary connection

on:
  push:
    branches: [main]
    paths: ['.github/workflows/summary-live-check.yml']

permissions:
  contents: read

concurrency:
  group: industry-report-monitor
  cancel-in-progress: false

jobs:
  test-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      STATE_PATH: test-state.sqlite3
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Read previous report metadata
        run: |
          git fetch --no-tags origin refs/heads/notification-state
          git show FETCH_HEAD:state.sqlite3 > test-state.sqlite3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check Google connection and send one summary
        run: python -m reportbot.summary_test
