name: Test report summary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: industry-report-monitor
  cancel-in-progress: false

jobs:
  test-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STATE_PATH: test-state.sqlite3
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check summary key
        shell: bash
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo '::error::GEMINI_API_KEY Secret을 등록하면 10줄 요약을 시험할 수 있습니다.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Read previous report metadata
        run: |
          git fetch --no-tags origin refs/heads/notification-state
          git show FETCH_HEAD:state.sqlite3 > test-state.sqlite3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Send one ten-line summary without re-sending the PDF
        run: python -m reportbot.summary_test
