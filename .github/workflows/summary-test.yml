name: Test report summary

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: '발송했던 한국 날짜 YYYY-MM-DD (비우면 최근 보고서 1건)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: industry-report-monitor
  cancel-in-progress: false

jobs:
  test-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI }}
      STATE_PATH: test-state.sqlite3
      REPORT_DATE: ${{ inputs.report_date }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check summary key
        shell: bash
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo '::error::GEMINI_API_KEY Secret을 등록하면 주제별 요약을 시험할 수 있습니다.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Read previous report metadata
        run: |
          git fetch --no-tags origin refs/heads/notification-state
          git show FETCH_HEAD:state.sqlite3 > test-state.sqlite3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Send selected PDFs with headings and supporting summary lines
        shell: bash
        run: |
          if [[ -n "$REPORT_DATE" ]]; then
            python -m reportbot.summary_test --date "$REPORT_DATE"
          else
            python -m reportbot.summary_test
          fi
