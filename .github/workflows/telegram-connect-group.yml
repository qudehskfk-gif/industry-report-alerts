name: Connect Telegram group

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-recipient-setup
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm requested group and privately send owner setup instructions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPECTED_BOT_USERNAME: YBDIndepthreportcodex_bot
        run: python -m scripts.connect_telegram_group
