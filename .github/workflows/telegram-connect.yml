name: Connect Telegram recipient

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-recipient-setup
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send recipient setup to private Telegram chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EXPECTED_BOT_USERNAME: YBDIndepthreportcodex_bot
        run: python scripts/connect_telegram.py
