name: Attach the original PDF for the summary

on:
  push:
    branches: [main]
    paths: ['.github/workflows/attach-summary-original.yml']

permissions:
  contents: read

concurrency:
  group: industry-report-monitor
  cancel-in-progress: false

jobs:
  attach-original:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Attach only the original PDF to the configured group
        run: |
          python - <<'PY'
          import hashlib
          import io
          from datetime import date
          from pypdf import PdfReader
          from reportbot.classify import Decision
          from reportbot.config import Config
          from reportbot.models import Report
          from reportbot.telegram import Telegram, download_pdf, pdf_filename, report_caption
          config = Config.from_env()
          telegram = Telegram(config.token, config.chat_id)
          info = telegram.call('getChat', {'chat_id': config.chat_id})
          if info.get('type') not in {'group', 'supergroup'}:
              raise SystemExit('설정된 수신처가 그룹방이 아니어서 전송하지 않았습니다.')
          report = Report(
              'naver', '46573', '역래깅 이후, 시선은 구조조정으로', '신한투자증권', date(2026, 10, 21),
              'https://stock.naver.com/research/industry/46573',
              'https://stock.pstatic.net/stock-research/industry/21/20261021_industry_856550000.pdf',
              sector='석유화학',
          )
          data = download_pdf(report.pdf_url)
          digest = hashlib.sha256(data).hexdigest()
          if digest != '874c79c84bd713c7cdd767d06caf42ead434de426c85e18fb9c672f54f1f55cb':
              raise SystemExit('요약했던 PDF와 원문 파일이 달라 전송하지 않았습니다.')
          pages = len(PdfReader(io.BytesIO(data), strict=False).pages)
          caption = '📎 방금 보낸 10줄 요약의 PDF 원문입니다.\n\n' + report_caption(report, Decision(True, '산업 리포트 26쪽 (분량 기준)', pages))
          with io.BytesIO(data) as document:
              result = telegram.call('sendDocument', {
                  'chat_id': config.chat_id, 'caption': caption, 'parse_mode': 'HTML',
              }, files={'document': (pdf_filename(report), document, 'application/pdf')})
          if result.get('chat', {}).get('type') not in {'group', 'supergroup'}:
              raise SystemExit('텔레그램 응답의 그룹방 정보를 확인하지 못했습니다.')
          print(f'그룹방으로 PDF 원문 1건을 첨부했습니다 ({pages}쪽). 요약과 발송 기록은 변경하지 않았습니다.')
          PY
